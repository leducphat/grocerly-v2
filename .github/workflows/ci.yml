# Continuous integration for Grocerly. See docs/DECISIONS.md D-019.
#
# Runs on every push to develop/main and on every pull request into main.
# The test jobs never read grocerly/.env or reach a real service: Django runs
# with grocerly.settings_test (in-memory SQLite, fake VNPay secret, no Gemini
# key). Lint and static analysis (ruff D-029, jscpd D-031) and the secret scan
# (D-030) run as their own jobs. The deploy job (P-11, D-034, D-036) is the only
# one that reaches a real service, and it runs only on a push to main, after
# every other job has passed.

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

# The workflow only reads the code; it never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  twin-files:
    name: AGENTS.md and CLAUDE.md match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # D-006: the two files must be identical from line 2 on.
      - name: Compare the twin agent files
        run: diff <(tail -n +2 AGENTS.md) <(tail -n +2 CLAUDE.md)

  lint:
    name: Lint and static analysis (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grocerly
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Neither tool needs Django, so only these two are installed. The versions
      # are read from requirements-dev.txt so that CI and local runs match.
      - name: Install ruff and jscpd
        run: |
          pip install "$(grep '^ruff==' requirements-dev.txt)" \
                      "$(grep '^jscpd==' requirements-dev.txt)"

      # Rules come from grocerly/ruff.toml. The github format puts each error
      # next to the line it is about in the commit and pull request views.
      - name: Run ruff
        run: ruff check --output-format=github .

      # Duplicated lines in the Python code. Scope and the 3% limit come from
      # grocerly/.jscpd.json (D-031).
      - name: Check code duplication
        run: jscpd . --no-colors

      - name: Write results to the run summary
        if: always()
        run: |
          echo "## Lint and static analysis" >> "$GITHUB_STEP_SUMMARY"
          if ruff check . > /dev/null; then
            echo "ruff: no errors" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ruff: errors per rule" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ruff check --statistics . >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "jscpd (duplication):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          jscpd . --no-colors >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      # From gitleaks_8.30.1_checksums.txt on the GitHub release page.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # The whole history, not only the last commit: a key that was committed
      # once and deleted later is still readable from the history.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Stop if the downloaded file is not exactly the published release.
      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      # Fails when anything is found. --redact keeps the secret itself out of
      # the log and the report.
      - name: Scan the git history
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --verbose \
            --report-format json --report-path gitleaks-report.json

      - name: Write scan result to the run summary
        if: always()
        run: |
          echo "## Secret scan" >> "$GITHUB_STEP_SUMMARY"
          echo "gitleaks ${GITLEAKS_VERSION}, full git history: $(jq length gitleaks-report.json) finding(s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  test:
    name: Build, check and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grocerly
    env:
      DJANGO_SETTINGS_MODULE: grocerly.settings_test
    steps:
      - uses: actions/checkout@v5

      # Keep in step with ruff.toml and with the Python version of the
      # deployed service.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: grocerly/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check

      # Fails when a model was changed without a migration.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      # Coverage scope and exclusions come from grocerly/.coveragerc.
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml

      - name: Write coverage table to the run summary
        if: always()
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: grocerly/coverage.xml
          if-no-files-found: ignore

  deploy:
    name: Deploy to Render
    # Pull requests and develop stop at the jobs above. The production
    # environment on GitHub only accepts main and holds the deploy hook, so no
    # other job can read it, and every run of this job is listed as a deployment.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [twin-files, lint, secret-scan, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://grocerly-v2.onrender.com
    env:
      SITE_URL: https://grocerly-v2.onrender.com
    steps:
      # The hook URL ends in ?key=..., which is Render's secret, so it is kept in
      # a secret and never echoed. ref= makes Render build exactly the commit
      # tested above, not whatever main points to when the build starts. The
      # answer only holds the id of the new deploy.
      - name: Ask Render to deploy this commit
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "${DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"

      # Render runs build.sh (install, collectstatic, migrate) and only then
      # moves traffic to the new server, so until that moment the health
      # endpoint still names the old commit. A build that fails never gets
      # there, and the job turns red at the deadline. The free plan may also be
      # asleep, which costs about a minute on the first request.
      - name: Wait until the site runs this commit
        run: |
          deadline=$((SECONDS + 15 * 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            running=$(curl -fsS --max-time 90 "$SITE_URL/api/v1/health/" | jq -r '.commit' || true)
            echo "Site runs: ${running:-no answer}"
            if [ "$running" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "The site did not switch to $GITHUB_SHA within 15 minutes."
          exit 1

      - name: Write deploy result to the run summary
        if: always()
        run: |
          echo "## Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit ${GITHUB_SHA} on ${SITE_URL}: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
