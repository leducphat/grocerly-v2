# Lint rules for Grocerly. See docs/DECISIONS.md D-029.
# Run from grocerly/:  ruff check .
#
# The rule groups are listed one by one on purpose: the default set of Ruff
# changes between versions, and the CI result must not depend on that.

# Same Python version as CI and the production image (grocerly/Dockerfile).
target-version = "py312"

# Migrations are generated by Django, not written by hand.
extend-exclude = ["*/migrations/*"]

[lint]
select = [
    "E4", "E7", "E9", "F",  # pyflakes + pycodestyle errors: unused imports, undefined names, bare except
    "B",                    # flake8-bugbear: code that runs but is very likely a bug
    "DJ",                   # flake8-django: Django model and form conventions
    "S",                    # flake8-bandit: security checks
]
ignore = [
    # null=True on a CharField/TextField. Fixing it changes the database schema
    # and the stored data of the TLCN models, so it is not a lint-only change.
    "DJ001",
]

[lint.per-file-ignores]
# Tests use assert on purpose and create users with fixed fake passwords.
"**/tests/**" = ["S101", "S105", "S106"]
"conftest.py" = ["S101", "S105", "S106"]
# Fake keys that only exist for the test run (D-018).
"grocerly/settings_test.py" = ["S105"]
