[pytest]
DJANGO_SETTINGS_MODULE = grocerly.settings_test
python_files = test_*.py
testpaths = core userauths useradmin store_api
# A test marked xfail must really fail: once a known defect (L-x in
# docs/COMMITMENT.md) is fixed, the run turns red until the marker is removed.
xfail_strict = true
addopts = --strict-markers
filterwarnings =
    # WhiteNoise warns that STATIC_ROOT is missing; tests never run collectstatic.
    ignore:No directory at:UserWarning
