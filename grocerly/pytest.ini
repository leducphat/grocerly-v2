[pytest]
DJANGO_SETTINGS_MODULE = grocerly.settings_test
python_files = test_*.py
testpaths = core userauths useradmin store_api grocerly
markers =
    e2e: drives a real browser against a live server (D-042); run with `pytest -m e2e`
# A test marked xfail must really fail: once a known defect (L-x in
# docs/COMMITMENT.md) is fixed, the run turns red until the marker is removed.
xfail_strict = true
# A plain `pytest` skips the browser tests; `pytest -m e2e` runs only them (the
# last -m on the command line wins over this one).
addopts = --strict-markers -m "not e2e"
filterwarnings =
    # WhiteNoise warns that STATIC_ROOT is missing; tests never run collectstatic.
    ignore:No directory at:UserWarning
